name: Release

# Push a tag like v1.4 to build every platform zip and attach them to the GitHub release for that tag
# (the release is created if it doesn't exist yet). Run it manually from the Actions tab to just build
# the zips and download them as a workflow artifact without touching any release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release zips
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # SDK versions need three parts: v1.4 -> 1.4.0
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && VERSION="$VERSION.0"
          else
            VERSION=""
          fi
          bash packaging/build-release.sh $VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: artifacts/*.zip

      - name: Attach zips to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/*.zip --clobber
